services:
  mysql:
    image: mysql:8.4
    container_name: bookshelf-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?copie .env.example para .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bookshelf}
      MYSQL_USER: ${MYSQL_USER:-bookshelf}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?copie .env.example para .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  adminer:
    image: adminer:5
    container_name: bookshelf-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
